name: daily-update

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: oplus-history-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests cryptography

      - name: v6 增量记录 + 日志补全（分片 ${{ matrix.shard }}/6）
        run: python3 scripts/daily_v6.py --shard ${{ matrix.shard }}/6 --taste

      - uses: actions/upload-artifact@v4
        with:
          name: ota-data-${{ matrix.shard }}
          path: |
            links/
            models/
          retention-days: 1

  commit:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests cryptography

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: 合并分片数据
        run: |
          for d in incoming/*/; do
            echo "合并 $d"
            cp -a "$d". .
          done

      - name: 版本史归一化
        run: python3 scripts/normalize.py

      - name: 链接校验
        run: python3 scripts/verify.py
        continue-on-error: true

      - name: size/md5 CDN 对账（修正错误值）
        run: python3 scripts/site/verify_links.py 2>/dev/null || echo "跳过（脚本可选）"
        continue-on-error: true

      - name: 重建索引页
        run: python3 scripts/build_index.py

      - name: 重建 Markdown 版本史
        run: python3 scripts/build_md.py

      - name: 重建站点数据
        run: |
          python3 scripts/site/build_site_data.py
          python3 scripts/site/merge_arb_full.py

      - name: 提交并推送
        run: |
          git config user.name "oplus-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "chore: daily update $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase --autostash
            git push
          fi

      - name: 通知 RomBase 同步
        if: success()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ShiMahiru/RomBase/dispatches" \
            -d '{"event_type":"data-updated"}'
