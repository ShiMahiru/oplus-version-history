name: weekly-update

on:
  schedule:
    # 每周一 04:00 UTC（北京时间 12:00）
    - cron: "0 4 * * 1"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write

concurrency:
  group: oplus-history-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests cryptography

      - name: 官方增量更新（v3 + changelog + 降级包）
        run: python3 scripts/update.py

      - name: 版本史归一化（去重 / 排序 / 规范分隔符）
        run: python3 scripts/normalize.py

      - name: 全量链接校验（死链归档）
        run: python3 scripts/verify.py

      - name: 重建检索索引页（GitHub Pages）
        run: python3 scripts/build_index.py

      - name: 提交并推送
        run: |
          git config user.name "oplus-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "chore: weekly auto update $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi