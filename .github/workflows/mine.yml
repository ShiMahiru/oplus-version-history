name: Mine Fingerprints

on:
  workflow_dispatch:
    inputs:
      shard:
        description: "分片序号（0-7）"
        default: "0"
      total:
        description: "总分片数"
        default: "16"
  schedule:
    - cron: "0 6 * * *"   # 每天 06:00 UTC 数据更新后自动挖

concurrency:
  group: mine-${{ github.event.inputs.shard }}
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests cryptography

      - name: Mine
        run: |
          python3 scripts/mine_fingerprints.py --shard ${{ github.event.inputs.shard || 0 }} --total ${{ github.event.inputs.total || 8 }}

      - name: Commit mined data
        run: |
          git config user.name "oplus-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无新发现"
          else
            git commit -m "feat(mine): 分片 ${{ github.event.inputs.shard }} 指纹挖掘产物"
            git pull --rebase --autostash
            git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/ShiMahiru/oplus-version-history.git" main
          fi
